name: Generate Hunt 007
on:
  push:
    branches: [agent/add-hunt-007-account-use-after-containment]
    paths:
      - 'labs/007-account-use-after-containment/generate_lab.py'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-hunt-007-account-use-after-containment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate
        run: |
          python labs/007-account-use-after-containment/generate_lab.py
          python labs/007-account-use-after-containment/validate_lab.py
      - name: Commit generated lab
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add labs/007-account-use-after-containment README.md
          git diff --cached --quiet || git commit -m 'Generate Hunt 007 synthetic lab data'
          git push
