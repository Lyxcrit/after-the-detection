name: Hunt 011 one-time generation

on:
  push:
    branches:
      - review/hunt-011-startup-persistence

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/hunt-011-startup-persistence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate deterministic lab
        run: python labs/011-startup-configuration-provenance/generate_lab.py
      - name: Validate lab
        run: python labs/011-startup-configuration-provenance/validate_lab.py
      - name: Commit generated lab
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labs/011-startup-configuration-provenance
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Generate Hunt 011 lab"
            git push origin HEAD:review/hunt-011-startup-persistence
          fi
