name: Temporary Hunt 017 Capstone Generation
on:
  push:
    branches:
      - review/hunt-017-october-identity-capstone-20261026
    paths:
      - .github/workflows/temp-hunt-017-generation.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore source and run deterministic generator and validator
        env:
          ATD_SOURCE_B64: ""
        run: |
          python - <<'PY'
          import os, base64, io, tarfile, pathlib
          root = pathlib.Path("labs/017-october-2026-identity-persistence-capstone")
          root.mkdir(parents=True, exist_ok=True)
          data = base64.b64decode(os.environ["ATD_SOURCE_B64"], validate=True)
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:xz") as tar:
              tar.extractall(root)
          print("Restored capstone source files")
          PY
          cd labs/017-october-2026-identity-persistence-capstone
          python generate_lab.py
          python validate_lab.py
      - name: Link lab from repository README
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("README.md")
          s=p.read_text(encoding="utf-8")
          link="- [Hunt 017: October 2026 Identity Persistence Capstone](labs/017-october-2026-identity-persistence-capstone/README.md)"
          if link not in s:
              s=s.replace("## Why mock data?", link+"\n\n## Why mock data?")
              p.write_text(s,encoding="utf-8")
          PY
      - name: Commit complete validated capstone
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labs/017-october-2026-identity-persistence-capstone README.md
          if ! git diff --cached --quiet; then
            git commit -m "Hunt 017: validated October identity persistence capstone (110k records)"
            git push
          fi
