name: Temporary Hunt 017 Correlation Verification
on:
  push:
    branches:
      - review/hunt-017-correlation-proof-20261025
    paths:
      - .github/workflows/temp-hunt-017-correlation.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild data with corrected grant-token provenance
        env:
          ATD_SOURCE_B64: ""
        run: |
          python - <<'PY'
          import os, base64, io, tarfile, pathlib
          root=pathlib.Path("labs/017-october-2026-identity-persistence-capstone")
          data=base64.b64decode(os.environ["ATD_SOURCE_B64"],validate=True)
          with tarfile.open(fileobj=io.BytesIO(data),mode="r:xz") as tar:
              tar.extractall(root)
          PY
          cd labs/017-october-2026-identity-persistence-capstone
          python generate_lab.py
          python validate_lab.py
      - name: Commit validated correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labs/017-october-2026-identity-persistence-capstone
          if ! git diff --cached --quiet; then
            git commit -m "Hunt 017: enforce pre-existing interactive grant and token provenance"
            git push
          fi
