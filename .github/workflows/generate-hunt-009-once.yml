name: Generate Hunt 009 Once

on:
  push:
    branches:
      - review/hunt-009-scheduled-task
    paths:
      - .github/workflows/generate-hunt-009-once.yml
      - labs/009-scheduled-task-or-admin-automation/generate_lab.py

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/hunt-009-scheduled-task
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate lab
        run: python3 labs/009-scheduled-task-or-admin-automation/generate_lab.py
      - name: Validate lab
        run: python3 labs/009-scheduled-task-or-admin-automation/validate_lab.py
      - name: Commit generated lab
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add labs/009-scheduled-task-or-admin-automation
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Generate Hunt 009 lab data and materials"
            git push origin HEAD:review/hunt-009-scheduled-task
          fi
